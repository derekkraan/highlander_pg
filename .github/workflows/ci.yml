name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    name: Format

    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - run: mix deps.get
      - run: mix format --check-formatted

  test:
    runs-on: ubuntu-latest
    needs: format
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir-version: "1.15"
            otp-version: "24"
          - elixir-version: "1.16"
            otp-version: "26"
          - elixir-version: "1.19"
            otp-version: "28"

    name: Test (Elixir ${{ matrix.elixir-version }} / OTP ${{ matrix.otp-version }})

    services:
      postgres:
        image: postgres:16.2
        ports:
          - 5431:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: highlander
          POSTGRES_PORT: 5431

    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir-version }}
          otp-version: ${{ matrix.otp-version }}

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
