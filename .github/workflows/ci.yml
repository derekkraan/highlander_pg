name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir-version: "1.15"
            otp-version: "24"
          - elixir-version: "1.16"
            otp-version: "26"
          - elixir-version: "1.19"
            otp-version: "28"

    name: Tests (Elixir ${{ matrix.elixir-version }} / OTP ${{ matrix.otp-version }})

    services:
      postgres:
        image: postgres:16.2
        ports:
          - 5431:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: highlander
          POSTGRES_PORT: 5431

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir-version }}
          otp-version: ${{ matrix.otp-version }}

      - run: mix deps.get

      - run: mix compile --warnings-as-errors
        if: matrix.elixir-version == '1.19' && matrix.otp-version == '28'

      - run: mix format --check-formatted
        if: matrix.elixir-version == '1.19' && matrix.otp-version == '28'

      - run: mix test
